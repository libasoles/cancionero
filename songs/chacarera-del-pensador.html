<h1>Chacarera del pensador</h1>
<p class="lead">Raúl Carnota · Tonalidad: Mi mayor</p>

<!-- Fuente base: Cifra Club / raul-carnota/chacarera-del-pensador.
     Tono publicado por la fuente: C#m. La progresión reposa en E en las
     estrofas; se toma Mi mayor como centro tonal para el cancionero. Sin capo.
     Acordes usados: E, B7, A, F#7, E/G#, F#m7, G#7, C#m7, B.

     Estrofas 1 y 2:
       V1 = E al inicio, B7 a mitad, E al cierre.
       V2 = A al inicio, E a mitad, A al cierre.
       V3 = F#7 al inicio, B7 al cierre.
       V4 = A al inicio, E a mitad, B7 antes del final, E al cierre.

     Puente:
       V1 = E al inicio, E/G# a mitad, F#m7 al cierre.
       V2 = G#7 a mitad, C#m7 al cierre.
       V3 = F#7 al cierre.
       V4 = A al inicio, E a mitad, B7 antes del final, E al cierre.

     Estrofas 3 y 4:
       La fuente continúa con el mismo patrón de las estrofas 1 y 2.
       Aparece un "B" suelto al inicio de la última sección en la transcripción.

     Composición atribuida en la fuente: Raúl Carnota.
     La letra completa no se incluye acá; si el usuario la pega en el chat,
     este archivo ya queda listo para alinearla con el markup de <song-sheet>. -->
<song-sheet>
<div class="letra">
  <p class="estrofa">
    <span class="seccion">Pendiente</span>
    Página preparada con tonalidad, acordes y estructura armónica.<br>
    Falta cargar la letra en el markup de <code>&lt;song-sheet&gt;</code>.
  </p>
</div>
</song-sheet>
