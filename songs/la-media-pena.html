<!-- Fuente base: Cifra Club / mercedes-sosa/la-media-pena.
     Tono publicado por la fuente: Em. Sin capo.
     Acordes usados: Em, B7, Am, E7.

     Estrofa base:
       V1 = Em al inicio, B7 a mitad, Em al cierre.
       V2 = Em al inicio, B7 a mitad, Em al cierre.
       V3 = Am al inicio, E7 a mitad, Am al cierre.
       V4 = Am al inicio, E7 a mitad, Am al cierre.
       Remate = B7 al inicio, Em al cierre.

     Estribillo:
       V1 = Em al inicio.
       V2 = Em al inicio.
       V3 = Am al inicio.
       V4 = Am al inicio.
       Remate = B7 al inicio, B7 y Em al cierre.

     Segunda parte:
       La fuente mantiene el mismo patrón de la estrofa base y cierra con
       otro remate sobre B7 y Em.

     Composición atribuida en la fuente: Jose Antonio Nunez y Carlos Martin Vallejos.
     La letra completa no se incluye acá; si el usuario la pega en el chat,
     este archivo ya queda listo para alinearla con el markup de <song-sheet>. -->
