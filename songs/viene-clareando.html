<p class="lead">Atahualpa Yupanqui · Tonalidad: La menor</p>

<!-- Fuente base: Cifra Club / atahualpa-yupanqui/viene-clareando.
     Tono publicado por la fuente: G. La progresión y los cierres reposan en Am;
     se toma La menor como centro tonal para el cancionero. Sin capo.
     Acordes usados: Am, E, G, F, Dm, C.

     Patrón principal de estrofa:
       V1 = Am al inicio, E a mitad.
       V2 = Am al cierre.
       V3 = Am al inicio, G a mitad, F después, E al cierre.
       V4 = Dm al inicio, C a mitad, E después, Am al cierre.

     Copla central:
       Repite V1 y V2.
       V3 = G a mitad, F después, E al cierre.
       V4 = Dm al inicio, C a mitad, E después, Am al cierre.

     Últimas dos estrofas:
       La fuente mantiene el mismo esquema armónico general.

     Composición atribuida en la fuente: Atahualpa Yupanqui.
     La letra completa no se incluye acá; si el usuario la pega en el chat,
     este archivo ya queda listo para alinearla con el markup de <song-sheet>. -->
<song-sheet>
<div class="letra">
  <p class="estrofa">
    <span class="seccion">Pendiente</span>
    Página preparada con tonalidad, acordes y estructura armónica.<br>

  </p>
</div>
